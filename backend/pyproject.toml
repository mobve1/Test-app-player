[project]
name = "stemwave-backend"
version = "2.0.0"
description = "Stemwave UVR Audio Separator & Player Backend"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "pydantic-settings>=2.5.0",
    "psutil>=6.0.0",
    "yt-dlp>=2024.10.22",
    "audio-separator[gpu]>=0.29.0",
    "pywebview>=5.3"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
